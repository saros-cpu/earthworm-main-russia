server:
  port: 8080
  tomcat:
    max-swallow-size: -1

spring:
  servlet:
    multipart:
      max-file-size: 120MB
      max-request-size: 120MB
  datasource:
    url: jdbc:mysql://localhost:3306/earthworm?useSSL=false&serverTimezone=UTC
    username: root
    password: ***REDACTED***
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: "CHANGE_ME_TO_RANDOM_256_BIT_STRING"
  expirationMs: 604800000

cors:
  allowedOrigins: "http://localhost:3000,http://localhost:3001"

openai:
  provider: ${AI_PROVIDER:openrouter}
  enabled: ${OPENAI_ENABLED:true}
  apiKey: ${OPENROUTER_API_KEY:${OPENAI_API_KEY:}}
  baseUrl: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
  siteUrl: ${OPENROUTER_SITE_URL:http://localhost:3000}
  appName: ${OPENROUTER_APP_NAME:Russian Learning}
